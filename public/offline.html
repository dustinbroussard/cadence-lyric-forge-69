<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
  <title>Cadence Codex — Offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 35%), #0d0a0f;
      color: #f3f3f3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 16px 60px rgba(0,0,0,0.35);
    }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { margin: 0 0 8px; line-height: 1.6; }
    .hint { opacity: 0.8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <h1>You're Offline</h1>
    <p>Cadence Codex is still here. Previously opened pages and assets remain available.</p>
    <p class="hint">Reconnect to generate new lyrics, refresh model lists, or sync your latest edits.</p>
  </main>
</body>
</html>
